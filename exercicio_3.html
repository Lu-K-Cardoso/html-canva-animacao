<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravidade</title>
</head>
<body>
    <canvas id="meuCanvas" style="background-color: #c7c7c7;"></canvas>
</body>
<script>
    const canvas = document.getElementById('meuCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 600;
    canvas.height = 400;

    let x = 100;
    let y = 100;
    let vx = 4;
    let vy = 3;
    const raio = 20;
    const gravidade = 0.2;
    const atrito = 0.9;

    function AtualizarCena(){
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#9b59b6';
        ctx.beginPath();
        ctx.arc(x, y, raio, 0, Math.PI * 2);
        ctx.fill();

        vy += gravidade;
        x += vx;
        y += vy;

        if(x + raio > canvas.width){
            x = canvas.width - raio;
            vx = -vx;
        }else if(x - raio < 0){
            x = raio;
            vx = -vx;
        }
    }

</script>
</html>
