<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japão</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 85vh; background-color: #c7c7c7;">
    <canvas id="meuCanvas" style="background-color: #c7c7c7;"></canvas>
</body>
<script>
    const canvas = document.getElementById('meuCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 600;
    canvas.height = 400;

    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 600, 400); 

    ctx.fillStyle = '#ff003c';
    ctx.beginPath();
    ctx.arc(300, 200, 100, 0, Math.PI * 2);
    ctx.fill();
</script>
</html>
