<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japão</title>
</head>
<body bgcolor="gray">
    <canvas id="meuCanvas" style="background-color: white;"></canvas>
</body>
<script>
    const canvas = document.getElementById('meuCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 600;
    canvas.height = 400;

    ctx.fillStyle = '#ff003c';
    ctx.beginPath();
    ctx.arc(300, 200, 100, 0, Math.PI * 2);
    ctx.fill();
</script>
</html>
